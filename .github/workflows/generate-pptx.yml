name: Generate PPTX

on:
  workflow_dispatch:
    inputs:
      year:
        description: '년도'
        required: true
      month:
        description: '월'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # PDF/JPG 변환(soffice 49개 원 x 최대 2개 파일) 추가로 여유 확대

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pptx-server/requirements.txt

      - name: Install LibreOffice (PDF/JPG 변환용)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress
          soffice --version

      - name: Generate PPTX
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YEAR:                 ${{ inputs.year }}
          MONTH:                ${{ inputs.month }}
        run: python pptx-server/app_actions.py
